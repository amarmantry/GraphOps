<div th:fragment="content">
    <h1 class="text-2xl font-semibold text-white mb-1">Service Dependencies</h1>
    <p class="text-slate-400 mb-8">Pick a service to see what it directly calls, reads from, or writes to.</p>

    <div th:if="${dbError}" class="bg-red-950 border border-red-800 text-red-200 rounded-lg px-4 py-3 mb-6">
        Could not reach the database. Please check the connection and try again.
    </div>

    <form method="get" action="/" class="flex gap-3 mb-8" th:unless="${dbError}">
        <select name="service" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm flex-1 focus:outline-none focus:border-emerald-500">
            <option value="">Select a service…</option>
            <option th:each="s : ${services}"
                    th:value="${s.name}"
                    th:text="${s.name} + ' (' + ${s.team} + ')'"
                    th:selected="${s.name == selectedService}">
            </option>
        </select>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 transition text-white text-sm font-medium px-5 py-2 rounded-lg">
            View
        </button>
    </form>

    <div th:if="${selectedService != null and dependencies != null and !dependencies.isEmpty()}">
        <h2 class="text-sm uppercase tracking-wide text-slate-500 mb-3" th:text="${selectedService} + ' depends on:'"></h2>
        <div class="grid gap-3">
            <div th:each="d : ${dependencies}" class="bg-slate-900 border border-slate-800 rounded-lg px-5 py-4 flex items-center justify-between">
                <div>
                    <span class="text-white font-medium" th:text="${d.target}"></span>
                    <span class="text-slate-500 text-sm ml-2" th:text="${d.relationshipType}"></span>
                </div>
                <div class="flex items-center gap-3 text-sm">
                    <span th:if="${d.protocolOrOperation != null}" class="text-slate-400" th:text="${d.protocolOrOperation}"></span>
                    <span th:if="${d.latencyMs != null}" class="text-slate-500" th:text="${d.latencyMs} + 'ms'"></span>
                    <span th:if="${d.critical != null and d.critical}" class="bg-amber-900 text-amber-300 text-xs font-medium px-2 py-0.5 rounded">critical</span>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${selectedService != null and (dependencies == null or dependencies.isEmpty())}" class="text-slate-500 text-sm">
        No direct dependencies found for this service.
    </div>
</div>
